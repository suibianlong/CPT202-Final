name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend-check:
    name: Frontend Check and Static Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend tooling dependencies
        working-directory: frontend
        run: npm ci

      - name: Package static frontend resources
        run: |
          mkdir -p dist/frontend
          rsync -a --delete --exclude='.DS_Store' frontend/ dist/frontend/
          tar -czf dist/herlink-frontend-static.tar.gz -C dist frontend

      - name: Upload frontend static artifact
        uses: actions/upload-artifact@v4
        with:
          name: herlink-frontend-static
          path: |
            dist/frontend
            dist/herlink-frontend-static.tar.gz

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: |
          set -o pipefail
          ./mvnw -B clean test jacoco:report | tee backend-test.log

      - name: Generate JaCoCo coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
          generate-branches-badge: true
          badges-directory: backend/.github/badges

      - name: Print coverage summary to console
        working-directory: backend
        run: |
          echo "==========================================="
          echo " JaCoCo Coverage Report Summary"
          echo "==========================================="

          CSV_FILE="target/site/jacoco/jacoco.csv"
          if [ -f "$CSV_FILE" ]; then
            tail -n +2 "$CSV_FILE" | awk -F',' '
            {
              INSTRUCTION_MISSED += $4
              INSTRUCTION_COVERED += $5
              BRANCH_MISSED += $6
              BRANCH_COVERED += $7
              LINE_MISSED += $8
              LINE_COVERED += $9
            }
            END {
              INSTRUCTION_TOTAL = INSTRUCTION_COVERED + INSTRUCTION_MISSED
              BRANCH_TOTAL = BRANCH_COVERED + BRANCH_MISSED
              LINE_TOTAL = LINE_COVERED + LINE_MISSED

              if (INSTRUCTION_TOTAL > 0) {
                printf " Instruction Coverage: %.2f%% (%d/%d)\n",
                  (INSTRUCTION_COVERED / INSTRUCTION_TOTAL) * 100, INSTRUCTION_COVERED, INSTRUCTION_TOTAL
              }
              if (BRANCH_TOTAL > 0) {
                printf " Branch Coverage: %.2f%% (%d/%d)\n",
                  (BRANCH_COVERED / BRANCH_TOTAL) * 100, BRANCH_COVERED, BRANCH_TOTAL
              }
              if (LINE_TOTAL > 0) {
                printf " Line Coverage: %.2f%% (%d/%d)\n",
                  (LINE_COVERED / LINE_TOTAL) * 100, LINE_COVERED, LINE_TOTAL
              }
            }'
          else
            echo "Warning: jacoco.csv not found"
          fi
          echo "==========================================="

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 30

      - name: Upload JaCoCo CSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-csv-report
          path: backend/target/site/jacoco/jacoco.csv
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/backend-test.log
          retention-days: 30

      - name: Summarize test timing by suite
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import glob
          import os
          import xml.etree.ElementTree as ET

          def collect(pattern: str, classifier):
              total_tests = 0
              total_time = 0.0
              failures = 0
              errors = 0
              skipped = 0
              for path in glob.glob(pattern):
                  try:
                      root = ET.parse(path).getroot()
                  except ET.ParseError:
                      continue
                  tests = int(root.attrib.get("tests", "0") or 0)
                  time = float(root.attrib.get("time", "0") or 0)
                  failures += int(root.attrib.get("failures", "0") or 0)
                  errors += int(root.attrib.get("errors", "0") or 0)
                  skipped += int(root.attrib.get("skipped", "0") or 0)
                  suite_name = root.attrib.get("name", "")
                  suite_class = root.attrib.get("classname", "")
                  bucket = classifier(path, suite_name, suite_class)
                  if bucket is None:
                      continue
                  total_tests += tests
                  total_time += time
              avg_ms = (total_time / total_tests * 1000.0) if total_tests else None
              return total_tests, total_time, avg_ms, failures, errors, skipped

          def classify_unit(path: str, suite_name: str, suite_class: str):
              return "unit"

          unit_tests, unit_time, unit_avg, unit_failures, unit_errors, unit_skipped = collect("target/surefire-reports/TEST-*.xml", classify_unit)
          def fmt(avg):
              return f"{avg:.2f} ms" if avg is not None else "N/A"

          def pass_rate(tests, failures, errors, skipped):
              if tests <= 0:
                  return "N/A"
              passed = tests - failures - errors - skipped
              if passed < 0:
                  passed = 0
              return f"{(passed / tests) * 100:.2f}%"

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Test Timing Summary",
              "",
              "| Suite | Test cases | Total time | Average per case | Pass rate |",
              "| --- | ---: | ---: | ---: | ---: |",
              f"| Unit tests | {unit_tests} | {unit_time:.2f}s | {fmt(unit_avg)} | {pass_rate(unit_tests, unit_failures, unit_errors, unit_skipped)} |",
          ]
          text = "\n".join(lines) + "\n"
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

  backend-slice-test:
    name: Backend Web Slice and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run web slice and integration tests
        working-directory: backend
        run: |
          set -o pipefail
          ./mvnw -B verify -Dskip.unit.tests=true | tee backend-slice-test.log

      - name: Summarize web slice and integration timing
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import glob
          import os
          import xml.etree.ElementTree as ET

          def collect(pattern: str, kind: str):
              total_tests = 0
              total_time = 0.0
              matched = 0
              failures = 0
              errors = 0
              skipped = 0
              for path in glob.glob(pattern):
                  try:
                      root = ET.parse(path).getroot()
                  except ET.ParseError:
                      continue
                  tests = int(root.attrib.get("tests", "0") or 0)
                  time = float(root.attrib.get("time", "0") or 0)
                  text = f"{path} {root.attrib.get('name', '')} {root.attrib.get('classname', '')}".lower()
                  if kind == "web-slice":
                      if "controller" not in text:
                          continue
                  elif kind == "integration":
                      if "integration" not in text or "controller" in text:
                          continue
                  file_failures = int(root.attrib.get("failures", "0") or 0)
                  file_errors = int(root.attrib.get("errors", "0") or 0)
                  file_skipped = int(root.attrib.get("skipped", "0") or 0)
                  total_tests += tests
                  total_time += time
                  failures += file_failures
                  errors += file_errors
                  skipped += file_skipped
                  matched += 1
              avg_ms = (total_time / total_tests * 1000.0) if total_tests else None
              return total_tests, total_time, avg_ms, matched, failures, errors, skipped

          def fmt(avg):
              return f"{avg:.2f} ms" if avg is not None else "N/A"

          def pass_rate(tests, failures, errors, skipped):
              if tests <= 0:
                  return "N/A"
              passed = tests - failures - errors - skipped
              if passed < 0:
                  passed = 0
              return f"{(passed / tests) * 100:.2f}%"

          web_tests, web_time, web_avg, web_files, web_failures, web_errors, web_skipped = collect("target/failsafe-reports/TEST-*.xml", "web-slice")
          integration_tests, integration_time, integration_avg, integration_files, integration_failures, integration_errors, integration_skipped = collect("target/failsafe-reports/TEST-*.xml", "integration")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Web Slice and Integration Timing Summary",
              "",
              "| Suite | Test cases | Total time | Average per case | Pass rate |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          if web_files:
              lines.append(f"| Web slice tests | {web_tests} | {web_time:.2f}s | {fmt(web_avg)} | {pass_rate(web_tests, web_failures, web_errors, web_skipped)} |")
          if integration_files:
              lines.append(f"| Integration tests | {integration_tests} | {integration_time:.2f}s | {fmt(integration_avg)} | {pass_rate(integration_tests, integration_failures, integration_errors, integration_skipped)} |")
          text = "\n".join(lines) + "\n"
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

  backend-test-summary:
    name: Backend Overall Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test
      - backend-slice-test

    steps:
      - name: Download unit test artifact
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: artifacts/unit

      - name: Download slice test artifact
        uses: actions/download-artifact@v4
        with:
          name: slice-test-results
          path: artifacts/slice

      - name: Summarize overall pass rate
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import glob
          import os
          import xml.etree.ElementTree as ET

          def read_stats(pattern: str, classifier=None):
              tests = failures = errors = skipped = 0
              files = 0
              for path in glob.glob(pattern, recursive=True):
                  try:
                      root = ET.parse(path).getroot()
                  except ET.ParseError:
                      continue
                  if classifier is not None and not classifier(path, root):
                      continue
                  tests += int(root.attrib.get("tests", "0") or 0)
                  failures += int(root.attrib.get("failures", "0") or 0)
                  errors += int(root.attrib.get("errors", "0") or 0)
                  skipped += int(root.attrib.get("skipped", "0") or 0)
                  files += 1
              return tests, failures, errors, skipped, files

          def classify_web_slice(path: str, root: ET.Element):
              text = f"{path} {root.attrib.get('name', '')} {root.attrib.get('classname', '')}".lower()
              return "controller" in text

          def classify_integration(path: str, root: ET.Element):
              text = f"{path} {root.attrib.get('name', '')} {root.attrib.get('classname', '')}".lower()
              return "integration" in text and "controller" not in text

          def pass_rate(tests, failures, errors, skipped):
              if tests <= 0:
                  return "N/A"
              passed = tests - failures - errors - skipped
              if passed < 0:
                  passed = 0
              return f"{(passed / tests) * 100:.2f}%"

          unit_tests, unit_failures, unit_errors, unit_skipped, unit_files = read_stats("artifacts/unit/**/surefire-reports/TEST-*.xml")
          web_tests, web_failures, web_errors, web_skipped, web_files = read_stats(
              "artifacts/slice/**/failsafe-reports/TEST-*.xml",
              classify_web_slice,
          )
          integration_tests, integration_failures, integration_errors, integration_skipped, integration_files = read_stats(
              "artifacts/slice/**/failsafe-reports/TEST-*.xml",
              classify_integration,
          )

          overall_tests = unit_tests + web_tests + integration_tests
          overall_failures = unit_failures + web_failures + integration_failures
          overall_errors = unit_errors + web_errors + integration_errors
          overall_skipped = unit_skipped + web_skipped + integration_skipped

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Test Pass Rate Summary",
              "",
              "| Scope | Test cases | Failures | Errors | Skipped | Pass rate |",
              "| --- | ---: | ---: | ---: | ---: | ---: |",
          ]
          if unit_files:
              lines.append(f"| Unit tests | {unit_tests} | {unit_failures} | {unit_errors} | {unit_skipped} | {pass_rate(unit_tests, unit_failures, unit_errors, unit_skipped)} |")
          if web_files:
              lines.append(f"| Web slice tests | {web_tests} | {web_failures} | {web_errors} | {web_skipped} | {pass_rate(web_tests, web_failures, web_errors, web_skipped)} |")
          if integration_files:
              lines.append(f"| Integration tests | {integration_tests} | {integration_failures} | {integration_errors} | {integration_skipped} | {pass_rate(integration_tests, integration_failures, integration_errors, integration_skipped)} |")

          lines.extend([
              "",
              "## Overall Test Pass Rate",
              "",
              "| Scope | Test cases | Failures | Errors | Skipped | Pass rate |",
              "| --- | ---: | ---: | ---: | ---: | ---: |",
              f"| Overall | {overall_tests} | {overall_failures} | {overall_errors} | {overall_skipped} | {pass_rate(overall_tests, overall_failures, overall_errors, overall_skipped)} |",
          ])

          text = "\n".join(lines) + "\n"
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

      - name: Upload slice test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-test-results
          path: |
            backend/target/failsafe-reports/
            backend/backend-slice-test.log
          retention-days: 30

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs:
      - frontend-check
      - backend-test
      - backend-slice-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Build backend package
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: herlink-backend-jar
          path: backend/target/*.jar

  docker-build-push:
    name: Docker Build and Private Registry Push
    runs-on: ubuntu-latest
    needs:
      - backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: image
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
            IMAGE="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/herlink-app"
            {
              echo "push=true"
              echo "app_image=${IMAGE}:sha-${GITHUB_SHA}"
              echo "tags<<EOF"
              echo "${IMAGE}:sha-${GITHUB_SHA}"
              echo "${IMAGE}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "push=false"
              echo "app_image=herlink-app:ci-${GITHUB_SHA}"
              echo "tags<<EOF"
              echo "herlink-app:ci-${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Login to private registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.image.outputs.push == 'true' }}
          tags: ${{ steps.image.outputs.tags }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs:
      - docker-build-push

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/herlink_deploy_key
          chmod 600 ~/.ssh/herlink_deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_SSH_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy registry image with Docker Compose
        env:
          APP_IMAGE: ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_NAMESPACE }}/herlink-app:sha-${{ github.sha }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          HEALTHCHECK_URL="${DEPLOY_HEALTHCHECK_URL:-http://localhost/actuator/health}"
          REMOTE_ENV=$(printf 'APP_IMAGE=%q HEALTHCHECK_URL=%q REGISTRY_HOST=%q REGISTRY_USERNAME=%q REGISTRY_PASSWORD=%q SERVER_APP_DIR=%q' \
            "$APP_IMAGE" \
            "$HEALTHCHECK_URL" \
            "$REGISTRY_HOST" \
            "$REGISTRY_USERNAME" \
            "$REGISTRY_PASSWORD" \
            "$SERVER_APP_DIR")
          ssh -i ~/.ssh/herlink_deploy_key -p "${{ secrets.SERVER_SSH_PORT }}" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "$REMOTE_ENV bash -s" << 'EOF'
            set -e

            cd "${SERVER_APP_DIR}"

            printf '%s\n' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" \
              --username "${REGISTRY_USERNAME}" \
              --password-stdin

            export APP_IMAGE="${APP_IMAGE}"

            docker compose pull app
            docker compose up -d --no-build
            docker image prune -f

            sleep 15
            curl -fsS "${HEALTHCHECK_URL}"
          EOF
