<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage Resource Detail</title>
    <link rel="stylesheet" href="../shared/shared.css" />
    <link rel="stylesheet" href="./module6.css" />
</head>
<body data-page="viewer-detail">
<div class="viewer-shell">
    <header class="viewer-detail-topbar">
        <a href="./heritage-viewer.html" class="viewer-topbar-btn viewer-topbar-link">Back to Viewer</a>
        <div class="viewer-detail-actions">
            <a href="../account.html" class="viewer-topbar-btn viewer-topbar-link">Account</a>
        </div>
    </header>

    <main class="viewer-detail-main">
        <section class="viewer-detail-hero">
            <h1 id="detailTitle">Loading resource...</h1>
        </section>

        <section id="detailError" class="viewer-error hidden"></section>

        <div id="detailContent" class="viewer-detail-stack hidden">
            <div class="viewer-detail-grid">
                <section class="viewer-detail-card scenic-card">
                    <div class="section-head">
                        <div>
                            <h2>Overview</h2>
                        </div>
                    </div>

                    <div class="viewer-detail-meta">
                        <div class="viewer-meta-item">
                            <span class="viewer-meta-label">Resource ID</span>
                            <strong id="detailId">-</strong>
                        </div>
                        <div class="viewer-meta-item">
                            <span class="viewer-meta-label">Type</span>
                            <strong id="detailType">-</strong>
                        </div>
                        <div class="viewer-meta-item">
                            <span class="viewer-meta-label">Category</span>
                            <strong id="detailCategory">-</strong>
                        </div>
                        <div class="viewer-meta-item">
                            <span class="viewer-meta-label">Place</span>
                            <strong id="detailPlace">-</strong>
                        </div>
                        <div class="viewer-meta-item">
                            <span class="viewer-meta-label">Reviewed At</span>
                            <strong id="detailReviewedAt">-</strong>
                        </div>
                        <div class="viewer-meta-item">
                            <span class="viewer-meta-label">Copyright</span>
                            <strong id="detailCopyright">-</strong>
                        </div>
                    </div>

                    <div class="viewer-detail-copy">
                        <h3>Tags</h3>
                        <div id="detailTags" class="viewer-tag-list"></div>
                    </div>

                    <div class="viewer-detail-copy">
                        <h3>Description</h3>
                        <p id="detailDescription">-</p>
                    </div>
                </section>

                <section class="viewer-detail-card scenic-card">
                    <div class="section-head">
                        <div>
                            <h2>Preview Image</h2>
                        </div>
                    </div>

                    <div class="viewer-media-block">
                        <div id="previewContainer" class="viewer-media-slot"></div>
                    </div>

                </section>
            </div>

            <section class="viewer-detail-card scenic-card">
                <div class="section-head">
                    <div>
                        <h2>Main Media</h2>
                    </div>
                </div>

                <div class="viewer-media-block">
                    <div id="mediaContainer" class="viewer-media-slot"></div>
                </div>

                <form id="commentForm" class="viewer-form-stack">
                    <div class="field">
                        <label for="commentContent">Add a Comment</label>
                        <textarea id="commentContent" rows="4" maxlength="1000" placeholder="Share your thoughts about this heritage resource."></textarea>
                    </div>
                    <div class="viewer-form-actions">
                        <button id="commentSubmitBtn" type="submit" class="btn btn-primary">Post Comment</button>
                    </div>
                </form>

                <div id="commentList" class="viewer-comment-list">
                    <div class="viewer-empty-message">Loading comments...</div>
                </div>
            </section>

        </div>
    </main>
</div>

<div id="toast" class="toast"></div>

<script src="../shared/shared.js"></script>
<script src="./module6.js"></script>
</body>
</html>
